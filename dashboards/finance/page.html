<!-- Copy to dashboards/<name>/page.html. Replace NAME, DOMAIN and FEED. Publish dashboards/dist/<name>.html after `node dashboards/build.mjs <name>`. -->
<title>Personal Finance</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/*@KIT_CSS*/
/* page-specific styles below, built only from the kit tokens */
.tone-bad { color: var(--bad); } .tone-ok { color: var(--ok); }
.big { font-size: 26px; font-weight: 600; letter-spacing: -0.02em; }
.fine { font-size: 12px; }
.pace { display: grid; gap: 6px; }
.pace-line { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 6px 12px; }
.pace-bar { position: relative; height: 8px; overflow: visible; }
.pace-bar > i { border-radius: 4px; }
.pace-bar .tick { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--text); text-decoration: none; border-radius: 1px; }
.cat-sec { display: grid; gap: 8px; }
.cat-sec + .cat-sec { border-top: 1px solid var(--line); padding-top: 10px; margin-top: 4px; }
.cat-head, .cat-line { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.cat-row { display: grid; gap: 3px; }
.cat-row .cat-line, .goals .cat-line { font-size: 13px; }
.chart svg { display: block; max-width: 100%; height: auto; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--text-2); }
.legend li { display: flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
.subs, .goals { display: grid; gap: 10px; }
.subs li, .goals li { display: grid; gap: 3px; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
.subs li:last-child, .goals li:last-child { border-bottom: 0; padding-bottom: 0; }
.sub-line { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.acct-list { display: grid; gap: 4px; font-size: 13px; }
.acct-list li { display: grid; grid-template-columns: 5.5em 1fr auto; gap: 8px; }
.live-body { display: grid; gap: 12px; min-width: 0; }
.live-body .notice { max-width: none; }
</style>
<main id="app" aria-live="polite"></main>
<script>
document.documentElement.dataset.domain = "finance";
/*@KIT_JS*/
/*@PANELS_JS*/
boot({
  feed: "finance",
  render: (feed, file, mcp) => [
    headerBlock(feed, file),
    statusPanel(feed),
    kpiPanel(feed.panels),
    liveInvestmentsPanel(mcp),
    categoriesPanel(feed.panels),
    trendPanel(feed.panels),
    treasuryPanel(feed.panels),
    subscriptionsPanel(feed.panels),
    goalsPanel(feed.panels),
    questionsPanel(feed.questions),
    teamPanel(feed),
    sessionsPanel(feed.sessions),
    filesPanel(feed),
  ],
});
</script>
